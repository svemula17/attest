[project]
name = "attest"
version = "0.3.0"
description = "Continuous compliance control plane with a governed agent layer (PoC)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "pydantic>=2.7",
  "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "boto3>=1.34", "openpyxl>=3.1", "cyclonedx-bom>=4", "pip-audit>=2.7", "build>=1.2"]
llm = ["anthropic>=1.0"]
postgres = ["psycopg[binary]>=3.1"]
aws = ["boto3>=1.34"]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
attest = "attest.cli:main"
attest-mcp = "attest.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
attest = ["migrations/alembic.ini", "migrations/script.py.mako", "migrations/versions/*.py"]

[tool.setuptools.packages.find]
include = ["attest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:langsmith_plugin"
