# Alembic configuration for Attest. `attest.db.upgrade(url)` builds an equivalent
# Config programmatically; this file is for the CLI, e.g. from the repo root:
#   alembic -c attest/migrations/alembic.ini upgrade head
#   alembic -c attest/migrations/alembic.ini -x url=postgresql+psycopg://... upgrade head
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/../..
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///attest.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
